<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindDeck - アクティブラーニング単語帳</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { margin: 0; color: var(--accent-color); font-size: 1.8rem; }
        p { color: var(--text-sub); font-size: 0.9rem; }

        .container { max-width: 950px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .panel { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 15px; }
        h2 { font-size: 1.1rem; border-bottom: 2px solid var(--border-color); padding-bottom: 6px; margin-top: 0; }

        input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px 0; background-color: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); box-sizing: border-box; }
        button { background-color: var(--accent-color); color: #0f172a; border: none; padding: 10px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background-color: var(--accent-hover); }

        .notebook-list { list-style: none; padding: 0; margin: 0; }
        .notebook-item { padding: 10px; margin-bottom: 6px; background-color: #0f172a; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
        .notebook-item:hover, .notebook-item.active { border-color: var(--accent-color); background-color: #172554; }

        .tab-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background: #0f172a; color: var(--text-sub); border: 1px solid var(--border-color); flex: 1; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--accent-color); color: #0f172a; border-color: var(--accent-color); }

        .card-card { background-color: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .card-term { font-weight: bold; color: var(--accent-color); font-size: 1.05rem; }
        .card-expl { margin-top: 5px; color: var(--text-sub); white-space: pre-wrap; font-size: 0.95rem; }

        /* クイズ画面用スタイル */
        .quiz-box { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .choice-btn { background: #1e293b; color: var(--text-main); border: 1px solid var(--border-color); margin-top: 8px; text-align: left; }
        .choice-btn:hover { background: #334155; }
        .result-msg { margin-top: 15px; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

    <header>
        <h1>MindDeck</h1>
        <p>Java ✕ Python ✕ SQL 統合学習プラットフォーム</p>
    </header>

    <div class="container">
        <!-- 左側パネル -->
        <div>
            <div class="panel">
                <h2>🔍 逆引き全体検索</h2>
                <input type="text" id="searchInput" placeholder="キーワードで検索..." oninput="searchCards()">
            </div>
            <div class="panel">
                <h2>📚 ノートブック</h2>
                <input type="text" id="newNotebookTitle" placeholder="例: 認知心理学, XR基礎">
                <button onclick="createNotebook()">作成</button>
                <ul class="notebook-list" id="notebookList" style="margin-top: 12px;"></ul>
            </div>
        </div>

        <!-- 右側パネル：タブ切り替え（単語帳 vs クイズ） -->
        <div>
            <div class="panel">
                <div class="tab-buttons">
                    <button class="tab-btn active" id="tabDeckBtn" onclick="switchTab('deck')">📖 単語帳一覧</button>
                    <button class="tab-btn" id="tabQuizBtn" onclick="switchTab('quiz')">✍️ 自動クイズ挑戦</button>
                </div>

                <!-- 単語帳タブ -->
                <div id="deckView">
                    <div style="margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                        <h2 style="border:none; margin-bottom:5px;">用語の追加</h2>
                        
                        <!-- ▼ プルダウン選択を追加 -->
                        <label style="font-size: 0.85rem; color: var(--text-sub);">保存先ノートブック:</label>
                        <select id="notebookSelect">
                            <option value="">-- ノートブックを選択してください --</option>
                        </select>

                        <input type="text" id="cardTerm" placeholder="用語 (例: アフォーダンス)">
                        <textarea id="cardExpl" rows="2" placeholder="解説文を入力..."></textarea>
                        <button onclick="createCard()">カードを保存</button>
                    </div>
                    <h2 id="currentNotebookTitle">単語カード一覧</h2>
                    <div id="cardList"><p style="color: var(--text-sub);">ノートブックを選択してください。</p></div>
                </div>

                <!-- クイズタブ -->
                <div id="quizView" style="display: none;">
                    <h2>自動生成穴埋めクイズ</h2>
                    <div id="quizContainer">
                        <p style="color: var(--text-sub);">ノートブックを選択し、クイズを生成してください。</p>
                    </div>
                    <button onclick="loadQuiz()" style="margin-top: 15px; background: #10b981; color: white;">次の問題を作成</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const JAVA_API = 'https://minddeck-java-app.onrender.com/api';
        const PYTHON_API = 'https://minddeck-python-api.onrender.com/api';
        let currentNotebookId = null;
        let currentNotebookTitleText = '';
        let currentNotebookCards = [];

        // ノートブック一覧を取得し、左側リストと右側プルダウンの両方を更新する
        async function fetchNotebooks() {
            try {
                const res = await fetch(`${JAVA_API}/notebooks`);
                const notebooks = await res.json();
                
                // 1. 左側リストの更新
                const listEl = document.getElementById('notebookList');
                listEl.innerHTML = '';

                // 2. 右側プルダウンの更新
                const selectEl = document.getElementById('notebookSelect');
                selectEl.innerHTML = '<option value="">-- ノートブックを選択してください --</option>';

                notebooks.forEach(nb => {
                    // 左側のリストアイテム生成
                    const li = document.createElement('li');
                    li.className = `notebook-item ${currentNotebookId === nb.id ? 'active' : ''}`;
                    li.innerText = nb.title;
                    li.onclick = () => selectNotebook(nb.id, nb.title);
                    listEl.appendChild(li);

                    // 右側のプルダウン選択肢生成
                    const option = document.createElement('option');
                    option.value = nb.id;
                    option.textContent = nb.title;
                    if (currentNotebookId === nb.id) {
                        option.selected = true;
                    }
                    selectEl.appendChild(option);
                });
            } catch (e) {
                console.error('ノートブックの取得に失敗しました', e);
            }
        }

        // ノートブックを新規作成する
        async function createNotebook() {
            const titleInput = document.getElementById('newNotebookTitle');
            const title = titleInput.value.trim();
            if (!title) {
                alert('ノートブック名を入力してください');
                return;
            }

            try {
                const res = await fetch(`${JAVA_API}/notebooks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title })
                });

                if (res.ok) {
                    titleInput.value = '';
                    alert('ノートブックを作成しました！');
                    fetchNotebooks(); // 一覧とプルダウンを最新に更新
                } else {
                    alert('ノートブックの作成に失敗しました');
                }
            } catch (e) {
                console.error('通信エラー:', e);
            }
        }

        // ノートブックを選択したときの処理
        async function selectNotebook(id, title) {
            currentNotebookId = id;
            currentNotebookTitleText = title;
            document.getElementById('currentNotebookTitle').innerText = `「${title}」のカード`;
            
            // プルダウンの選択状態も連動させる
            document.getElementById('notebookSelect').value = id;
            
            fetchNotebooks();
            
            try {
                const res = await fetch(`${JAVA_API}/notebooks/${id}/cards`);
                currentNotebookCards = await res.json();
                renderCards(currentNotebookCards);
                if (document.getElementById('quizView').style.display === 'block') {
                    loadQuiz();
                }
            } catch (e) {
                console.error('カードの取得に失敗しました', e);
            }
        }

        // プルダウンからノートブックを変更したときにもカード一覧を切り替える連携
        document.getElementById('notebookSelect').addEventListener('change', function() {
            const selectedId = this.value;
            const selectedText = this.options[this.selectedIndex].text;
            if (selectedId) {
                selectNotebook(Number(selectedId), selectedText);
            }
        });

        // 単語カードを登録する（プルダウンで選ばれたノートブックに対して保存）
        async function createCard() {
            const notebookId = document.getElementById('notebookSelect').value;
            if (!notebookId) { 
                alert('保存先のノートブックを選択してください！'); 
                return; 
            }
            const term = document.getElementById('cardTerm').value.trim();
            const explanation = document.getElementById('cardExpl').value.trim();
            if (!term || !explanation) {
                alert('用語と解説の両方を入力してください！');
                return;
            }

            try {
                const res = await fetch(`${JAVA_API}/notebooks/${notebookId}/cards`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ term, explanation })
                });

                if (res.ok) {
                    document.getElementById('cardTerm').value = '';
                    document.getElementById('cardExpl').value = '';
                    alert('単語カードを保存しました！');
                    selectNotebook(Number(notebookId), document.getElementById('notebookSelect').options[document.getElementById('notebookSelect').selectedIndex].text);
                } else {
                    alert('カードの保存に失敗しました');
                }
            } catch (e) {
                console.error('通信エラー:', e);
            }
        }

        async function searchCards() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) { if (currentNotebookId) selectNotebook(currentNotebookId, currentNotebookTitleText); return; }
            try {
                const res = await fetch(`${JAVA_API}/cards/search?keyword=${encodeURIComponent(keyword)}`);
                const cards = await res.json();
                document.getElementById('currentNotebookTitle').innerText = `「${keyword}」の検索結果`;
                renderCards(cards);
            } catch (e) {
                console.error('検索エラー:', e);
            }
        }

        function renderCards(cards) {
            const container = document.getElementById('cardList');
            container.innerHTML = '';
            if (cards.length === 0) { container.innerHTML = '<p style="color: var(--text-sub);">カードがありません。</p>'; return; }
            cards.forEach(card => {
                const div = document.createElement('div');
                div.className = 'card-card';
                div.innerHTML = `<div class="card-term">${card.term}</div><div class="card-expl">${card.explanation}</div>`;
                container.appendChild(div);
            });
        }

        function switchTab(tab) {
            document.getElementById('tabDeckBtn').classList.toggle('active', tab === 'deck');
            document.getElementById('tabQuizBtn').classList.toggle('active', tab === 'quiz');
            document.getElementById('deckView').style.display = tab === 'deck' ? 'block' : 'none';
            document.getElementById('quizView').style.display = tab === 'quiz' ? 'block' : 'none';
            if (tab === 'quiz') loadQuiz();
        }

        async function loadQuiz() {
            const container = document.getElementById('quizContainer');
            if (!currentNotebookId || currentNotebookCards.length === 0) {
                container.innerHTML = '<p style="color: var(--text-sub);">クイズを作るための単語がノートにありません。まずはカードを登録してください！</p>';
                return;
            }
            const target = currentNotebookCards[Math.floor(Math.random() * currentNotebookCards.length)];

            try {
                const response = await fetch(`${PYTHON_API}/generate-quiz`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: target, all_cards: currentNotebookCards })
                });
                const quiz = await response.json();

                let html = `<div class="quiz-box">
                    <p style="font-weight: bold; color: var(--accent-color);">Q. 次の空欄（＿＿＿＿）に入る用語は何でしょう？</p>
                    <p style="background: #0f172a; padding: 12px; border-radius: 6px; line-height: 1.6;">${quiz.question}</p>
                    <div style="margin-top: 15px;">`;
                
                quiz.choices.forEach(choice => {
                    html +=
