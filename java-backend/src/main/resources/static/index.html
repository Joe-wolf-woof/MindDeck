<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindDeck - アクティブラーニング単語帳</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --border-color: #334155;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --tag-bg: #312e81;
            --tag-text: #a5b4fc;
        }
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 15px; background: var(--bg-color); color: var(--text-main); box-sizing: border-box; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: #818cf8; font-size: 1.8rem; margin-bottom: 5px; }
        header p { color: var(--text-sub); font-size: 0.9rem; }
        
        .container { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        .panel { background: var(--panel-bg); padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid var(--border-color); padding-bottom: 6px; color: #a5b4fc; }
        
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 12px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); box-sizing: border-box; font-size: 1rem; }
        input:disabled, textarea:disabled { opacity: 0.6; cursor: not-allowed; }
        
        button { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; font-size: 0.95rem; }
        button:hover { background: var(--accent-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background: #334155; color: var(--text-sub); }
        .tab-btn.active { background: var(--accent); color: white; }
        
        .notebook-list { list-style: none; padding: 0; margin: 0; max-height: 220px; overflow-y: auto; }
        .notebook-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; margin-bottom: 6px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; transition: all 0.2s; }
        .notebook-item:hover { background: #334155; }
        .notebook-item.active { border-color: var(--accent); background: #312e81; color: white; }
        .notebook-title { cursor: pointer; flex-grow: 1; word-break: break-all; }
        .notebook-actions { display: flex; gap: 4px; }
        
        .nb-action-btn { background: transparent; border: none; cursor: pointer; font-size: 1rem; padding: 4px 6px; width: auto; border-radius: 4px; transition: background 0.2s; }
        .nb-action-btn:hover { background: rgba(255,255,255,0.15); }

        .card-card { background: #0f172a; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; transition: border-color 0.2s; }
        .card-card:hover { border-color: #818cf8; }
        .card-term { font-weight: bold; color: #818cf8; margin-bottom: 4px; font-size: 1.05rem; }
        .card-expl { color: var(--text-main); font-size: 0.9rem; line-height: 1.4; margin-bottom: 8px; }
        
        .tag-badge { display: inline-block; background: var(--tag-bg); color: var(--tag-text); font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; margin-right: 4px; border: 1px solid #4338ca; }
        
        .choice-btn { background: #334155; margin-top: 8px; text-align: left; }
        .choice-btn:hover { background: #475569; }

        .btn-secondary { background: #334155; margin-bottom: 10px; }
        .btn-secondary:hover { background: #475569; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }
        
        .btn-ai { background: #059669; margin-bottom: 8px; font-size: 0.85rem; padding: 6px 10px; width: auto; }
        .btn-ai:hover { background: #047857; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background-color: var(--panel-bg); margin: 30px auto; padding: 20px; border: 1px solid var(--border-color); width: 100%; max-width: 600px; border-radius: 10px; box-sizing: border-box; }
        .close-modal { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; line-height: 20px; }
        .close-modal:hover { color: #fff; }
        
        .field-option-btn { background: #334155; margin-bottom: 8px; text-align: left; }
        .field-option-btn:hover { background: #475569; }
    </style>
</head>
<body>

    <header>
        <h1>MindDeck</h1>
        <p>Java ✕ Python ✕ SQL 統合学習プラットフォーム</p>
    </header>

    <div class="container">
        <!-- 左側パネル -->
        <div>
            <div class="panel">
                <h2>🔍 逆引き全体検索</h2>
                <input type="text" id="searchInput" placeholder="キーワードで検索..." oninput="searchCards()">
            </div>
            
            <div class="panel">
                <h2>📚 ノートブック</h2>
                <input type="text" id="newNotebookTitle" placeholder="例: 認知心理学基礎">
                <button type="button" onclick="createNotebook()">ノートブックを作成</button>
                <ul class="notebook-list" id="notebookList" style="margin-top: 12px;"></ul>
            </div>
        </div>

        <!-- 右側パネル -->
        <div>
            <div class="panel">
                <div class="tab-buttons">
                    <button type="button" class="tab-btn active" id="tabDeckBtn" onclick="switchTab('deck')">📖 単語帳</button>
                    <button type="button" class="tab-btn" id="tabQuizBtn" onclick="switchTab('quiz')">✍️ AI自動クイズ</button>
                </div>

                <!-- 単語帳タブ -->
                <div id="deckView">
                    <div style="margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h2 style="border:none; margin-bottom:5px;">✍️ 用語の追加</h2>
                            <button type="button" id="aiGenBtn" class="btn-ai" onclick="openFieldSelectModal()">💬 AI解説を自動生成</button>
                        </div>
                        <input type="text" id="cardTerm" placeholder="用語 (例: アフォーダンス)">
                        <textarea id="cardExpl" rows="3" placeholder="解説文を入力..."></textarea>
                        
                        <label style="font-size: 0.85rem; color: var(--text-sub);">タグ (例: #Java #重要)</label>
                        <input type="text" id="cardTags" placeholder="#Java #重要">

                        <button type="button" id="saveCardBtn" onclick="createCard()">カードを保存</button>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h2 id="currentNotebookTitle" style="margin:0; border:none;">直近のカード</h2>
                        <button type="button" class="btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" onclick="openCardListModal()">カード一覧へ ➔</button>
                    </div>
                    <div id="recentCardList"><p style="color: var(--text-sub);">左側のリストからノートブックを選択してください。</p></div>
                </div>

                <!-- クイズタブ -->
                <div id="quizView" style="display: none;">
                    <h2>AI自動生成 用語クイズ</h2>
                    <div id="quizContainer">
                        <p style="color: var(--text-sub);">ノートブックを選択し、クイズを生成してください。</p>
                    </div>
                    <button type="button" onclick="loadQuiz()" style="margin-top: 15px; background: #10b981;">次の問題を作成</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ① AI分野選択モーダル -->
    <div id="fieldSelectModal" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <span class="close-modal" onclick="closeFieldSelectModal()">&times;</span>
            <h2>💬 分野の選択</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 15px;">解説を生成する分野を選択してください。</p>
            <div id="fieldOptionsContainer"></div>
        </div>
    </div>

    <!-- カード一覧モーダル -->
    <div id="cardListModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCardListModal()">&times;</span>
            <h2 id="modalNotebookTitle" style="color: #a5b4fc;">カード一覧</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 15px;">カードをタップすると編集・削除ができます。</p>
            <div id="fullCardList" style="max-height: 60vh; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- 編集・削除モーダル -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeEditModal()">&times;</span>
            <h2>カードの編集・削除</h2>
            <input type="hidden" id="editCardId">
            
            <label style="font-size: 0.85rem; color: var(--text-sub);">所属ノートブック</label>
            <select id="editNotebookSelect"></select>

            <label style="font-size: 0.85rem; color: var(--text-sub);">用語</label>
            <input type="text" id="editTerm">
            
            <label style="font-size: 0.85rem; color: var(--text-sub);">解説文</label>
            <textarea id="editExpl" rows="3"></textarea>
            
            <label style="font-size: 0.85rem; color: var(--text-sub);">タグ</label>
            <input type="text" id="editTags" placeholder="#Java #重要">
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button type="button" onclick="updateCard()">更新する</button>
                <button type="button" class="btn-danger" onclick="deleteCard()">削除する</button>
            </div>
        </div>
    </div>

    <script>
        const JAVA_API = 'https://minddeck-java-app.onrender.com/api';
        const PYTHON_API = 'https://minddeck-python-api.onrender.com/api';
        let currentNotebookId = null;
        let currentNotebookTitleText = '';
        let currentNotebookCards = [];
        let allSystemCards = [];
        let allNotebooksData = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchNotebooks();
            fetchAllCardsForQuizPool();
        });

        async function fetchAllCardsForQuizPool() {
            try {
                const res = await fetch(`${JAVA_API}/cards/search?keyword=`);
                if (res.ok) allSystemCards = await res.json();
            } catch (e) { console.error(e); }
        }

        async function fetchNotebooks() {
            try {
                const res = await fetch(`${JAVA_API}/notebooks`);
                if (!res.ok) throw new Error();
                allNotebooksData = await res.json();
                const listEl = document.getElementById('notebookList');
                listEl.innerHTML = '';
                
                if (!Array.isArray(allNotebooksData) || allNotebooksData.length === 0) {
                    listEl.innerHTML = '<li style="color: var(--text-sub); text-align: center; padding: 10px;">ノートブックがありません</li>';
                    return;
                }

                allNotebooksData.forEach(nb => {
                    const li = document.createElement('li');
                    li.className = `notebook-item ${currentNotebookId === nb.id ? 'active' : ''}`;
                    li.innerHTML = `
                        <span class="notebook-title" onclick="selectNotebook(${nb.id}, '${escapeHtml(nb.title)}')">${escapeHtml(nb.title)}</span>
                        <div class="notebook-actions">
                            <button class="nb-action-btn" title="編集" onclick="renameNotebook(${nb.id}, '${escapeHtml(nb.title)}')">✏️</button>
                            <button class="nb-action-btn" title="削除" onclick="deleteNotebook(${nb.id})">🗑️</button>
                        </div>
                    `;
                    listEl.appendChild(li);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function createNotebook() {
            const titleInput = document.getElementById('newNotebookTitle');
            if (!titleInput || !titleInput.value.trim()) {
                alert('ノートブック名を入力してください');
                return;
            }
            try {
                const res = await fetch(`${JAVA_API}/notebooks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: titleInput.value.trim() })
                });
                if (res.ok) {
                    titleInput.value = '';
                    fetchNotebooks();
                } else {
                    alert('ノートブックの作成に失敗しました');
                }
            } catch (e) { console.error(e); }
        }

        async function renameNotebook(id, currentTitle) {
            const newTitle = prompt("新しいノートブック名を入力してください:", currentTitle);
            if (!newTitle || !newTitle.trim() || newTitle === currentTitle) return;

            try {
                const res = await fetch(`${JAVA_API}/notebooks/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle.trim() })
                });
                if (res.ok) {
                    fetchNotebooks();
                    if (currentNotebookId === id) {
                        currentNotebookTitleText = newTitle.trim();
                        document.getElementById('currentNotebookTitle').innerText = `「${currentNotebookTitleText}」の直近カード`;
                    }
                } else {
                    alert('ノートブック名の変更に失敗しました');
                }
            } catch (e) { console.error(e); }
        }

        async function deleteNotebook(id) {
            if (!confirm("このノートブックと中のカードがすべて削除されます。よろしいですか？")) return;

            try {
                const res = await fetch(`${JAVA_API}/notebooks/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    if (currentNotebookId === id) {
                        currentNotebookId = null;
                        document.getElementById('recentCardList').innerHTML = '<p style="color: var(--text-sub);">左側のリストからノートブックを選択してください。</p>';
                        document.getElementById('currentNotebookTitle').innerText = '直近のカード';
                    }
                    fetchNotebooks();
                } else {
                    alert('ノートブックの削除に失敗しました');
                }
            } catch (e) { console.error(e); }
        }

        async function selectNotebook(id, title) {
            currentNotebookId = id;
            currentNotebookTitleText = title;
            fetchNotebooks();
            
            try {
                const res = await fetch(`${JAVA_API}/notebooks/${id}/cards`);
                if (!res.ok) throw new Error();
                const cards = await res.json();
                currentNotebookCards = Array.isArray(cards) ? cards : [];
                renderRecentCards(currentNotebookCards);
            } catch (e) {
                currentNotebookCards = [];
                renderRecentCards([]);
            }
        }

        async function openFieldSelectModal() {
            const term = document.getElementById('cardTerm').value.trim();
            if (!term) {
                alert('先に対象の「用語」を入力してください！');
                return;
            }

            const container = document.getElementById('fieldOptionsContainer');
            container.innerHTML = '<p style="color: var(--text-sub);">関連する分野を検索中... 🤖</p>';
            document.getElementById('fieldSelectModal').style.display = 'block';

            try {
                const res = await fetch(`${PYTHON_API}/ai-get-fields`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ term: term })
                });
                if (res.ok) {
                    const data = await res.json();
                    const fields = data.fields || [];
                    container.innerHTML = '';
                    fields.forEach(field => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'choice-btn field-option-btn';
                        btn.innerText = `📂 ${field}`;
                        btn.onclick = () => generateAiExplanationByField(term, field);
                        container.appendChild(btn);
                    });
                } else {
                    container.innerHTML = '<p style="color: #ef4444;">分野候補の取得に失敗しました。</p>';
                }
            } catch (e) {
                container.innerHTML = '<p style="color: #ef4444;">Pythonサーバーに接続できません。</p>';
            }
        }

        function closeFieldSelectModal() {
            document.getElementById('fieldSelectModal').style.display = 'none';
        }

        // 💬 選択された分野で解説生成（生成中は入力欄とボタンをロック）
        async function generateAiExplanationByField(term, field) {
            closeFieldSelectModal();
            const termInput = document.getElementById('cardTerm');
            const explArea = document.getElementById('cardExpl');
            const tagsInput = document.getElementById('cardTags');
            const aiGenBtn = document.getElementById('aiGenBtn');
            const saveCardBtn = document.getElementById('saveCardBtn');

            // --- ① 生成開始：入力フィールドとボタンをすべてロック ---
            termInput.disabled = true;
            explArea.disabled = true;
            tagsInput.disabled = true;
            aiGenBtn.disabled = true;
            saveCardBtn.disabled = true;
            
            explArea.value = `「${field}」の観点で解説を生成中... 💬`;

            try {
                const res = await fetch(`${PYTHON_API}/ai-generate-explanation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ term: term, field: field })
                });
                if (res.ok) {
                    const data = await res.json();
                    explArea.value = data.explanation || '';
                    if (data.tag_candidate && !tagsInput.value.trim()) {
                        tagsInput.value = data.tag_candidate;
                    }
                } else {
                    explArea.value = '';
                    alert('AI解説の生成に失敗しました');
                }
            } catch (e) {
                explArea.value = '';
                alert('Python AIサーバーに接続できません');
            } finally {
                // --- ② 生成終了（成功・失敗問わず）：ロックを解除 ---
                termInput.disabled = false;
                explArea.disabled = false;
                tagsInput.disabled = false;
                aiGenBtn.disabled = false;
                saveCardBtn.disabled = false;
            }
        }

        async function createCard() {
            if (!currentNotebookId) {
                alert('保存先のノートブックを左側のリストから選択してください！');
                return;
            }
            const term = document.getElementById('cardTerm').value.trim();
            const explanation = document.getElementById('cardExpl').value.trim();
            const tags = document.getElementById('cardTags').value.trim();

            if (!term || !explanation) {
                alert('用語と解説を入力してください！');
                return;
            }

            const isDuplicate = Array.isArray(currentNotebookCards) && 
                currentNotebookCards.some(card => card.term && card.term.trim().toLowerCase() === term.toLowerCase());
            
            if (isDuplicate) {
                alert(`「${term}」は既にこのノートブックに登録されています。`);
                return;
            }

            try {
                const res = await fetch(`${JAVA_API}/notebooks/${currentNotebookId}/cards`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ term, explanation, tags })
                });

                if (res.ok) {
                    document.getElementById('cardTerm').value = '';
                    document.getElementById('cardExpl').value = '';
                    document.getElementById('cardTags').value = '';
                    selectNotebook(currentNotebookId, currentNotebookTitleText);
                    fetchAllCardsForQuizPool();
                } else {
                    alert('カードの保存に失敗しました');
                }
            } catch (e) { console.error(e); }
        }

        function renderRecentCards(cards) {
            const container = document.getElementById('recentCardList');
            container.innerHTML = '';
            if (!cards || cards.length === 0) {
                container.innerHTML = '<p style="color: var(--text-sub);">このノートブックにはまだカードが登録されていません。</p>';
                return;
            }
            const recentTwo = cards.slice(-2).reverse();
            recentTwo.forEach(card => {
                const div = document.createElement('div');
                div.className = 'card-card';
                div.onclick = () => openEditModal(card);
                
                let tagsHtml = card.tags ? card.tags.split(/\s+/).map(t => `<span class="tag-badge">${escapeHtml(t)}</span>`).join('') : '';

                div.innerHTML = `
                    <div class="card-term">📌 ${escapeHtml(card.term)}</div>
                    <div class="card-expl">${escapeHtml(card.explanation)}</div>
                    <div>${tagsHtml}</div>
                `;
                container.appendChild(div);
            });
        }

        function openCardListModal() {
            if (!currentNotebookId) {
                alert('ノートブックを選択してください。');
                return;
            }
            document.getElementById('modalNotebookTitle').innerText = `「${currentNotebookTitleText}」のカード一覧`;
            const container = document.getElementById('fullCardList');
            container.innerHTML = '';

            if (!currentNotebookCards || currentNotebookCards.length === 0) {
                container.innerHTML = '<p style="color: var(--text-sub);">登録されたカードはありません。</p>';
            } else {
                currentNotebookCards.forEach(card => {
                    const div = document.createElement('div');
                    div.className = 'card-card';
                    div.onclick = () => {
                        closeCardListModal();
                        openEditModal(card);
                    };
                    let tagsHtml = card.tags ? card.tags.split(/\s+/).map(t => `<span class="tag-badge">${escapeHtml(t)}</span>`).join('') : '';
                    div.innerHTML = `
                        <div class="card-term">📌 ${escapeHtml(card.term)}</div>
                        <div class="card-expl">${escapeHtml(card.explanation)}</div>
                        <div>${tagsHtml}</div>
                    `;
                    container.appendChild(div);
                });
            }
            document.getElementById('cardListModal').style.display = 'block';
        }

        function closeCardListModal() { document.getElementById('cardListModal').style.display = 'none'; }

        async function openEditModal(card) {
            document.getElementById('editCardId').value = card.id;
            document.getElementById('editTerm').value = card.term;
            document.getElementById('editExpl').value = card.explanation;
            document.getElementById('editTags').value = card.tags || '';

            const nbSelect = document.getElementById('editNotebookSelect');
            nbSelect.innerHTML = '';
            allNotebooksData.forEach(nb => {
                const opt = document.createElement('option');
                opt.value = nb.id;
                opt.textContent = nb.title;
                if (card.notebook && card.notebook.id === nb.id) {
                    opt.selected = true;
                } else if (!card.notebook && nb.id === currentNotebookId) {
                    opt.selected = true;
                }
                nbSelect.appendChild(opt);
            });

            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

        async function updateCard() {
            const cardId = document.getElementById('editCardId').value;
            const term = document.getElementById('editTerm').value.trim();
            const explanation = document.getElementById('editExpl').value.trim();
            const tags = document.getElementById('editTags').value.trim();
            const notebookId = document.getElementById('editNotebookSelect').value;

            if (!term || !explanation) {
                alert('用語と解説を入力してください。');
                return;
            }

            try {
                const res = await fetch(`${JAVA_API}/cards/${cardId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ term, explanation, tags, notebookId: Number(notebookId) })
                });
                if (res.ok) {
                    closeEditModal();
                    selectNotebook(currentNotebookId, currentNotebookTitleText);
                    fetchAllCardsForQuizPool();
                } else {
                    alert('カードの更新に失敗しました');
                }
            } catch (e) { console.error(e); }
        }

        async function deleteCard() {
            const cardId = document.getElementById('editCardId').value;
            if (!confirm('本当にこのカードを削除しますか？')) return;

            try {
                const res = await fetch(`${JAVA_API}/cards/${cardId}`, { method: 'DELETE' });
                if (res.ok) {
                    closeEditModal();
                    selectNotebook(currentNotebookId, currentNotebookTitleText);
                    fetchAllCardsForQuizPool();
                } else {
                    alert('カードの削除に失敗しました');
                }
            } catch (e) { console.error(e); }
        }

        async function searchCards() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                if (currentNotebookId) selectNotebook(currentNotebookId, currentNotebookTitleText);
                return;
            }
            try {
                const res = await fetch(`${JAVA_API}/cards/search?keyword=${encodeURIComponent(keyword)}`);
                if (!res.ok) return;
                const cards = await res.json();
                const container = document.getElementById('recentCardList');
                container.innerHTML = `<p style="font-size:0.85rem; color:#818cf8; margin-bottom:8px;">「${keyword}」の検索結果 (${cards.length}件)</p>`;
                
                if (!Array.isArray(cards) || cards.length === 0) {
                    container.innerHTML += '<p style="color: var(--text-sub);">一致するカードはありません。</p>';
                    return;
                }

                cards.forEach(card => {
                    const div = document.createElement('div');
                    div.className = 'card-card';
                    div.onclick = () => openEditModal(card);
                    let tagsHtml = card.tags ? card.tags.split(/\s+/).map(t => `<span class="tag-badge">${escapeHtml(t)}</span>`).join('') : '';
                    div.innerHTML = `
                        <div class="card-term">📌 ${escapeHtml(card.term)}</div>
                        <div class="card-expl">${escapeHtml(card.explanation)}</div>
                        <div>${tagsHtml}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        function switchTab(tab) {
            document.getElementById('tabDeckBtn').classList.toggle('active', tab === 'deck');
            document.getElementById('tabQuizBtn').classList.toggle('active', tab === 'quiz');
            document.getElementById('deckView').style.display = tab === 'deck' ? 'block' : 'none';
            document.getElementById('quizView').style.display = tab === 'quiz' ? 'block' : 'none';
            if (tab === 'quiz') loadQuiz();
        }

        async function loadQuiz() {
            const container = document.getElementById('quizContainer');
            if (!currentNotebookId || !currentNotebookCards || currentNotebookCards.length === 0) {
                container.innerHTML = '<p style="color: var(--text-sub);">ノートブックを選択し、クイズを生成してください。</p>';
                return;
            }
            const target = currentNotebookCards[Math.floor(Math.random() * currentNotebookCards.length)];
            const cardPool = (allSystemCards.length > currentNotebookCards.length) ? allSystemCards : currentNotebookCards;

            try {
                const response = await fetch(`${PYTHON_API}/generate-quiz`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: target, all_cards: cardPool })
                });
                if (!response.ok) throw new Error();
                const quiz = await response.json();

                let formattedQuestion = quiz.question || target.explanation;
                formattedQuestion = formattedQuestion.replace(/【解説ヒント】/g, '【解説】');

                let html = `<div class="card-card" style="cursor:default;">
                    <p style="font-weight: bold; color: #818cf8; margin-top:0;">Q. 次の用語は何でしょう？</p>
                    <p style="background: #1e293b; padding: 12px; border-radius: 6px; line-height: 1.6;">${formattedQuestion}</p>
                    <div style="margin-top: 15px;">`;
                
                quiz.choices.forEach(choice => {
                    html += `<button type="button" class="choice-btn" onclick="checkAnswer(this, '${escapeQuote(choice)}', '${escapeQuote(quiz.correct_answer)}')">${escapeHtml(choice)}</button>`;
                });
                html += `</div><div id="quizResult" style="margin-top: 10px; font-weight: bold;"></div></div>`;
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<p style="color: #ef4444;">Pythonクイズサーバー（FastAPI）に接続できません。</p>';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeQuote(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function checkAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => b.disabled = true);
            const resMsg = document.getElementById('quizResult');
            if (selected === correct) {
                btn.style.background = '#22c55e';
                resMsg.style.color = '#22c55e';
                resMsg.innerText = '正解です！ 🎉';
            } else {
                btn.style.background = '#ef4444';
                resMsg.style.color = '#ef4444';
                resMsg.innerText = `不正解… 正解は「${correct}」でした。`;
                allBtns.forEach(b => { if (b.innerText === correct) b.style.background = '#22c55e'; });
            }
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = "none";
            }
        }
    </script>
</body>
</html>
