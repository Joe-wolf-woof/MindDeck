<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MindDeck - アクティブラーニング単語帳</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --border-color: #334155;
        }
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: var(--bg-color); color: var(--text-main); }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: #818cf8; font-size: 2rem; margin-bottom: 5px; }
        header p { color: var(--text-sub); }
        .container { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .panel { background: var(--panel-bg); padding: 20px; margin-bottom: 20px; border-radius: 10px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { font-size: 1.2rem; margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; color: #a5b4fc; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 12px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); box-sizing: border-box; }
        button { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background: #334155; color: var(--text-sub); }
        .tab-btn.active { background: var(--accent); color: white; }
        .notebook-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; }
        .notebook-item { padding: 10px; margin-bottom: 6px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .notebook-item:hover { background: #334155; }
        .notebook-item.active { border-color: var(--accent); background: #312e81; color: white; }
        .card-card { background: #0f172a; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .card-term { font-weight: bold; color: #818cf8; margin-bottom: 4px; font-size: 1.1rem; }
        .card-expl { color: var(--text-main); font-size: 0.95rem; line-height: 1.5; }
        .choice-btn { background: #334155; margin-top: 8px; text-align: left; }
        .choice-btn:hover { background: #475569; }
    </style>
</head>
<body>

    <header>
        <h1>MindDeck</h1>
        <p>Java ✕ Python ✕ SQL 統合学習プラットフォーム</p>
    </header>

    <div class="container">
        <!-- 左側パネル：検索 ＆ ノートブック一覧・作成 -->
        <div>
            <div class="panel">
                <h2>🔍 逆引き全体検索</h2>
                <input type="text" id="searchInput" placeholder="キーワードで検索..." oninput="searchCards()">
            </div>
            
            <div class="panel">
                <h2>📚 ノートブック</h2>
                <input type="text" id="newNotebookTitle" placeholder="例: 認知心理学基礎">
                <button onclick="createNotebook()">ノートブックを作成</button>
                <ul class="notebook-list" id="notebookList" style="margin-top: 12px;"></ul>
            </div>
        </div>

        <!-- 右側パネル：単語帳・クイズタブ -->
        <div>
            <div class="panel">
                <div class="tab-buttons">
                    <button class="tab-btn active" id="tabDeckBtn" onclick="switchTab('deck')">📖 単語帳一覧</button>
                    <button class="tab-btn" id="tabQuizBtn" onclick="switchTab('quiz')">✍️ 自動クイズ挑戦</button>
                </div>

                <!-- 単語帳タブ（カード登録 ＆ 選択したノートブックのカード一覧表示） -->
                <div id="deckView">
                    <div style="margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                        <h2 style="border:none; margin-bottom:5px;">✍️ 用語の追加</h2>
                        <input type="text" id="cardTerm" placeholder="用語 (例: アフォーダンス)">
                        <textarea id="cardExpl" rows="2" placeholder="解説文を入力..."></textarea>
                        <button onclick="createCard()">カードを保存</button>
                    </div>

                    <h2 id="currentNotebookTitle">単語カード一覧</h2>
                    <div id="cardList"><p style="color: var(--text-sub);">左側のリストからノートブックを選択してください。</p></div>
                </div>

                <!-- クイズタブ -->
                <div id="quizView" style="display: none;">
                    <h2>自動生成穴埋めクイズ</h2>
                    <div id="quizContainer">
                        <p style="color: var(--text-sub);">ノートブックを選択し、クイズを生成してください。</p>
                    </div>
                    <button onclick="loadQuiz()" style="margin-top: 15px; background: #10b981;">次の問題を作成</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const JAVA_API = 'https://minddeck-java-app.onrender.com/api';
        const PYTHON_API = 'https://minddeck-python-api.onrender.com/api';
        let currentNotebookId = null;
        let currentNotebookTitleText = '';
        let currentNotebookCards = [];

        // ページ読み込み時にノートブック一覧を取得
        window.addEventListener('DOMContentLoaded', () => {
            fetchNotebooks();
        });

        // ノートブック一覧をサーバーから取得して左側リストに表示
        async function fetchNotebooks() {
            try {
                const res = await fetch(`${JAVA_API}/notebooks`);
                const notebooks = await res.json();
                const listEl = document.getElementById('notebookList');
                listEl.innerHTML = '';
                
                if (notebooks.length === 0) {
                    listEl.innerHTML = '<li style="color: var(--text-sub); text-align: center; padding: 10px;">ノートブックがありません</li>';
                    return;
                }

                notebooks.forEach(nb => {
                    const li = document.createElement('li');
                    li.className = `notebook-item ${currentNotebookId === nb.id ? 'active' : ''}`;
                    li.innerText = nb.title;
                    li.onclick = () => selectNotebook(nb.id, nb.title);
                    listEl.appendChild(li);
                });
            } catch (e) {
                console.error('ノートブックの取得に失敗しました', e);
            }
        }

        // 新規ノートブックを作成
        async function createNotebook() {
            const titleInput = document.getElementById('newNotebookTitle');
            if (!titleInput.value) {
                alert('ノートブック名を入力してください');
                return;
            }
            try {
                const res = await fetch(`${JAVA_API}/notebooks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: titleInput.value })
                });
                if (res.ok) {
                    titleInput.value = '';
                    fetchNotebooks();
                } else {
                    alert('ノートブックの作成に失敗しました');
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ノートブックを選択したときの処理（紐づくカードを縦に並べて表示する）
        async function selectNotebook(id, title) {
            currentNotebookId = id;
            currentNotebookTitleText = title;
            document.getElementById('currentNotebookTitle').innerText = `「${title}」のカード一覧`;
            fetchNotebooks();
            
            try {
                const res = await fetch(`${JAVA_API}/notebooks/${id}/cards`);
                currentNotebookCards = await res.json();
                renderCards(currentNotebookCards);
            } catch (e) {
                console.error('カードの取得に失敗しました', e);
            }
        }

        // 選択中のノートブックにカードを保存する
        async function createCard() {
            if (!currentNotebookId) {
                alert('保存先のノートブックを左側のリストから選択してください！');
                return;
            }
            const term = document.getElementById('cardTerm').value;
            const explanation = document.getElementById('cardExpl').value;
            if (!term || !explanation) {
                alert('用語と解説を入力してください！');
                return;
            }

            try {
                const res = await fetch(`${JAVA_API}/notebooks/${currentNotebookId}/cards`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ term, explanation })
                });

                if (res.ok) {
                    document.getElementById('cardTerm').value = '';
                    document.getElementById('cardExpl').value = '';
                    alert('カードを保存しました！');
                    // 保存後、自動でそのノートブックのカード一覧を再読み込みして反映
                    selectNotebook(currentNotebookId, currentNotebookTitleText);
                } else {
                    alert('カードの保存に失敗しました');
                }
            } catch (e) {
                console.error('通信エラー:', e);
            }
        }

        // カードを縦に並べて表示する関数
        function renderCards(cards) {
            const container = document.getElementById('cardList');
            container.innerHTML = '';
            if (cards.length === 0) {
                container.innerHTML = '<p style="color: var(--text-sub);">このノートブックにはまだカードが登録されていません。</p>';
                return;
            }
            cards.forEach(card => {
                const div = document.createElement('div');
                div.className = 'card-card';
                div.innerHTML = `
                    <div class="card-term">📌 ${card.term}</div>
                    <div class="card-expl">${card.explanation}</div>
                `;
                container.appendChild(div);
            });
        }

        // キーワード検索
        async function searchCards() {
            const keyword = document.getElementById('searchInput').value;
            if (!keyword) {
                if (currentNotebookId) selectNotebook(currentNotebookId, currentNotebookTitleText);
                return;
            }
            try {
                const res = await fetch(`${JAVA_API}/cards/search?keyword=${encodeURIComponent(keyword)}`);
                const cards = await res.json();
                document.getElementById('currentNotebookTitle').innerText = `「${keyword}」の検索結果`;
                renderCards(cards);
            } catch (e) {
                console.error(e);
            }
        }

        // タブ切り替え
        function switchTab(tab) {
            document.getElementById('tabDeckBtn').classList.toggle('active', tab === 'deck');
            document.getElementById('tabQuizBtn').classList.toggle('active', tab === 'quiz');
            document.getElementById('deckView').style.display = tab === 'deck' ? 'block' : 'none';
            document.getElementById('quizView').style.display = tab === 'quiz' ? 'block' : 'none';
            if (tab === 'quiz') loadQuiz();
        }

        // クイズ読み込み
        async function loadQuiz() {
            const container = document.getElementById('quizContainer');
            if (!currentNotebookId || currentNotebookCards.length === 0) {
                container.innerHTML = '<p style="color: var(--text-sub);">ノートブックを選択し、カードを登録してください。</p>';
                return;
            }
            const target = currentNotebookCards[Math.floor(Math.random() * currentNotebookCards.length)];

            try {
                const response = await fetch(`${PYTHON_API}/generate-quiz`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: target, all_cards: currentNotebookCards })
                });
                const quiz = await response.json();

                let html = `<div class="card-card">
                    <p style="font-weight: bold; color: #818cf8; margin-top:0;">Q. 空欄に入る用語は何でしょう？</p>
                    <p style="background: #1e293b; padding: 12px; border-radius: 6px; line-height: 1.6;">${quiz.question}</p>
                    <div style="margin-top: 15px;">`;
                
                quiz.choices.forEach(choice => {
                    html += `<button class="choice-btn" onclick="checkAnswer(this, '${choice}', '${quiz.correct_answer}')">${choice}</button>`;
                });
                html += `</div><div id="quizResult" style="margin-top: 10px; font-weight: bold;"></div></div>`;
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<p style="color: #ef4444;">Pythonクイズサーバー（FastAPI）に接続できません。</p>';
            }
        }

        function checkAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => b.disabled = true);
            const resMsg = document.getElementById('quizResult');
            if (selected === correct) {
                btn.style.background = '#22c55e';
                resMsg.style.color = '#22c55e';
                resMsg.innerText = '正解です！ 🎉';
            } else {
                btn.style.background = '#ef4444';
                resMsg.style.color = '#ef4444';
                resMsg.innerText = `不正解… 正解は「${correct}」でした。`;
                allBtns.forEach(b => { if (b.innerText === correct) b.style.background = '#22c55e'; });
            }
        }
    </script>
</body>
</html>
