spring.application.name=minddeck

# PostgreSQLの接続情報（環境変数から取得、未設定時はローカル用のPostgreSQL設定またはH2）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/minddeck_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ▼ ここを明示的に PostgreSQL のドライバに変更・固定する
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA・Hibernateの設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PostgreSQLを使用する場合のダイアレクト設定
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 起動時に schema.sql を自動実行させない
spring.sql.init.mode=never

# ルーティング（APIのエンドポイント）の登録状況を詳細にログ出力する
logging.level.org.springframework.web=DEBUG


server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
