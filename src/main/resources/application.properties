spring.application.name=minddeck

# 環境変数からデータベース接続情報を取得（未設定の場合はH2メモリDBを使用するフォールバック）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA・Hibernateの設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PostgreSQLを使用する場合のダイアレクト設定
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ▼【追加】起動時に schema.sql を自動実行させない（JPAにテーブル管理を任せる）
spring.sql.init.mode=never